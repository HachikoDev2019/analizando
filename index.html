<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e141b">
  <title>Repaso de redes</title>
  <style>
    :root {
      color-scheme: dark;
      --fondo: #0e141b;
      --tarjeta: #1a2330;
      --linea: #314056;
      --texto: #e8eef6;
      --gris: #8b98a8;
      --azul: #2f6fed;
      --verde: #1c8f4e;
      --hablando: #d0892a;
      --aviso: #ffb4a8;
      --duda: #f0c14a;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      max-width: 560px;
      margin: 0 auto;
      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        calc(28px + env(safe-area-inset-bottom));
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.35;
      -webkit-text-size-adjust: 100%;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    /* Botón grande, cómodo para el pulgar. */
    #btn-escuchar {
      width: 100%;
      min-height: 76px;
      border: 0;
      border-radius: 16px;
      background: var(--azul);
      color: white;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      touch-action: manipulation;
    }

    #btn-escuchar.activo { background: var(--verde); }

    /* Ámbar: está respondiendo, el micrófono está apagado. */
    #btn-escuchar.hablando { background: var(--hablando); }

    /* Solo iPhone: el texto del botón es más largo. */
    #btn-escuchar.modo-ios {
      font-size: 1.25rem;
      line-height: 1.2;
      padding: 10px 14px;
    }

    #btn-escuchar:active { transform: scale(0.99); }

    .aviso {
      margin: 12px 0 0;
      color: var(--gris);
      font-size: 0.85rem;
    }

    .transcripcion {
      min-height: 2.6em;
      margin: 14px 0 0;
      color: #9aa6b2;
      font-size: 0.92rem;
    }

    .mensaje {
      margin: 10px 0 0;
      color: var(--aviso);
      font-size: 1rem;
    }

    .mensaje:empty { display: none; }

    .tarjeta {
      margin-top: 14px;
      padding: 16px;
      background: var(--tarjeta);
      border-radius: 16px;
    }

    .vacio {
      margin: 0;
      color: var(--gris);
      font-size: 1rem;
    }

    .titulo-duda {
      margin: 0 0 12px;
      color: var(--duda);
      font-size: 1.05rem;
      font-weight: 800;
    }

    .opcion + .opcion {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--linea);
    }

    .pregunta {
      margin: 0 0 8px;
      color: #c5d0dc;
      font-size: 1rem;
    }

    .respuesta {
      margin: 0 0 8px;
      color: #ffffff;
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .nota {
      margin: 0;
      color: #e4ebf3;
      font-size: 1.05rem;
    }

    .estado {
      min-height: 1.3em;
      margin: 10px 0 0;
      color: #9aa6b2;
      font-size: 0.95rem;
    }

    .interruptor {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      margin-top: 8px;
      font-size: 1.05rem;
    }

    .interruptor input {
      width: 28px;
      height: 28px;
      margin: 0;
      accent-color: var(--verde);
    }

    .reinicios {
      margin: 0;
      color: #66788a;
      font-size: 0.78rem;
    }

    .diagnostico {
      margin: 28px 0 0;
      color: #66788a;
      font-size: 0.62rem;
      line-height: 1.35;
    }

    label.buscar {
      display: block;
      margin: 18px 0 8px;
      color: var(--gris);
      font-size: 0.9rem;
    }

    #buscador {
      width: 100%;
      min-height: 56px;
      padding: 12px 14px;
      border: 1px solid var(--linea);
      border-radius: 12px;
      background: #121820;
      color: white;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Repaso de redes</h1>

  <button id="btn-escuchar" type="button">Escuchar</button>

  <p id="aviso-principal" class="aviso">Mantén esta pantalla abierta y encendida. Si bloqueas el celular o cambias de app, deja de escuchar.</p>
  <p id="aviso-audifonos" class="aviso">Usa audífonos. Si no, el micrófono se escucha a sí mismo.</p>

  <p id="transcripcion" class="transcripcion"></p>
  <p id="mensaje" class="mensaje"></p>

  <section id="tarjeta" class="tarjeta">
    <p class="vacio">Aquí verás la respuesta.</p>
  </section>

  <p id="estado" class="estado"></p>

  <label class="interruptor">
    <input id="leer-voz" type="checkbox" checked>
    <span>Responder en voz alta</span>
  </label>

  <label class="interruptor">
    <input id="avisar-escucha" type="checkbox" checked>
    <span>Avisar cuando escuche</span>
  </label>

  <p id="reinicios" class="reinicios">Reinicios: 0</p>

  <label class="buscar" for="buscador">Si el micrófono falla, escribe unas palabras</label>
  <input id="buscador" type="search" placeholder="Ejemplo: puerta de enlace" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">

  <p id="diagnostico" class="diagnostico">escuchando: no | hablando: no | palabras: 0 | firma: —</p>

  <script>
    // Banco de preguntas del examen. Cada una trae pregunta, respuesta y nota.
    const BANCO = [
      {"pregunta": "¿Qué tipo de servidor se encarga de almacenar y compartir documentos?", "respuesta": "Servidor de archivos", "nota": "FTP es un protocolo de transferencia, no el servidor que almacena."},
      {"pregunta": "¿Cuál de los siguientes protocolos se utiliza para resolución de direcciones IP a MAC?", "respuesta": "ARP", "nota": "DNS traduce nombres a IP. ARP traduce IP a MAC."},
      {"pregunta": "¿Qué servidor asigna direcciones IP automáticamente?", "respuesta": "Servidor DHCP", "nota": "DHCP reparte IPs solo."},
      {"pregunta": "¿Cuál de las siguientes funciones corresponde a la capa de presentación del modelo OSI?", "respuesta": "Conversión de formatos de datos", "nota": "Presentación traduce, comprime y cifra."},
      {"pregunta": "¿Qué protocolo opera en la capa de red del modelo TCP/IP?", "respuesta": "IP", "nota": "UDP es transporte, HTTP es aplicación."},
      {"pregunta": "¿Qué equipo de red opera en la capa 2 y puede dividir dominios de colisión?", "respuesta": "Puente", "nota": "Hub y repetidor son capa 1 y no dividen nada."},
      {"pregunta": "¿Cuál es la función principal de la capa de enlace de datos en el modelo OSI?", "respuesta": "Detectar y corregir errores de transmisión", "nota": "La ruta eficiente es capa de red."},
      {"pregunta": "¿Qué componente es fundamental para interconectar dispositivos dentro de una red?", "respuesta": "NIC", "nota": "La tarjeta de red."},
      {"pregunta": "¿Cuál de los siguientes es un propósito principal de una red de computadoras?", "respuesta": "Compartir recursos e información", "nota": ""},
      {"pregunta": "¿Qué campo del encabezado Ethernet permite identificar el protocolo de capa superior?", "respuesta": "Type", "nota": "FCS detecta errores, Preamble sincroniza."},
      {"pregunta": "¿Cuál de los siguientes servicios típicos NO es ofrecido por la capa de sesión?", "respuesta": "Criptografía punto a punto", "nota": "El cifrado es de la capa de Presentación."},
      {"pregunta": "¿En qué capa del modelo OSI se encuentra la funcionalidad de control de flujo a nivel de tramas, y no a nivel de segmentos?", "respuesta": "Capa de enlace de datos", "nota": "Tramas = enlace. Segmentos = transporte."},
      {"pregunta": "¿Cuál es una característica crítica del diseño físico de un datacenter?", "respuesta": "Control ambiental y redundancia eléctrica", "nota": ""},
      {"pregunta": "¿Cuál de los siguientes servidores maneja el acceso a sitios web?", "respuesta": "Servidor Web", "nota": "El DNS solo encuentra la IP, no muestra la página."},
      {"pregunta": "¿Cuál de los siguientes no es un beneficio de las redes?", "respuesta": "Interrupción total del hardware", "nota": "Ojo, la pregunta es negativa."},
      {"pregunta": "¿Qué protocolo trabaja en la capa de transporte del modelo OSI?", "respuesta": "TCP", "nota": "Transporte = TCP y UDP."},
      {"pregunta": "¿En qué capa del modelo OSI se encuentra el protocolo HTTP?", "respuesta": "Aplicación", "nota": ""},
      {"pregunta": "¿Cuál de los siguientes dispositivos se utiliza para regenerar señales en una red?", "respuesta": "Repetidor", "nota": ""},
      {"pregunta": "¿Cuál es una diferencia clave entre los modelos OSI y TCP/IP?", "respuesta": "OSI es un modelo teórico; TCP/IP se basa en protocolos reales", "nota": ""},
      {"pregunta": "¿Qué protocolo de red no confiable se usa comúnmente para transmisión de video y voz por su baja latencia?", "respuesta": "UDP", "nota": "Rápido pero sin confirmación de entrega."},
      {"pregunta": "¿Qué función realiza un firewall de red a nivel avanzado?", "respuesta": "Aplica políticas de seguridad mediante inspección profunda de paquetes", "nota": ""},
      {"pregunta": "¿Qué capa del modelo OSI es responsable de la transmisión física de datos?", "respuesta": "Física", "nota": "Cables, señales y bits."},
      {"pregunta": "¿En qué topología cada nodo está conectado al siguiente formando un círculo cerrado?", "respuesta": "Anillo", "nota": ""},
      {"pregunta": "En el modelo OSI, ¿cuál capa establece, mantiene y termina sesiones entre aplicaciones?", "respuesta": "Capa de sesión", "nota": ""},
      {"pregunta": "¿Qué dispositivo opera en la capa 2 y realiza la conmutación de tramas?", "respuesta": "Switch", "nota": ""},
      {"pregunta": "¿Cuál es una ventaja de la conmutación Ethernet?", "respuesta": "Mejora la eficiencia de red", "nota": ""},
      {"pregunta": "¿Qué modelo conceptual divide el proceso de comunicación en 7 capas?", "respuesta": "OSI", "nota": "TCP/IP tiene 4."},
      {"pregunta": "¿Qué función realiza una dirección MAC en Ethernet?", "respuesta": "Identificar dispositivos de red", "nota": "Es el DNI de la tarjeta de red."},
      {"pregunta": "¿Cuál es el propósito de la puerta de enlace predeterminada en la configuración IP?", "respuesta": "Proveer acceso a redes externas", "nota": "Es la salida hacia Internet."},
      {"pregunta": "¿Cuál es la capa del modelo OSI que no tiene una correspondencia directa en el modelo TCP/IP?", "respuesta": "Capa de presentación", "nota": "En TCP/IP se absorbe dentro de Aplicación."},
      {"pregunta": "¿Cuál capa del modelo OSI se encarga de la segmentación y control de flujo?", "respuesta": "Transporte", "nota": ""},
      {"pregunta": "¿Qué capa del modelo OSI asegura la entrega completa de los datos y controla el flujo?", "respuesta": "Capa de transporte", "nota": ""},
      {"pregunta": "¿Cuál es la principal diferencia funcional entre un switch y un router?", "respuesta": "Un switch conecta dispositivos en una misma red", "nota": "El router conecta redes distintas."},
      {"pregunta": "¿Qué ocurre cuando un switch no conoce la dirección de destino?", "respuesta": "Difunde la trama por todos los puertos", "nota": "Luego aprende la ubicación."},
      {"pregunta": "¿Qué utilidad tiene la herramienta ping en el contexto de la configuración básica de red?", "respuesta": "Verificar la conectividad entre nodos", "nota": ""},
      {"pregunta": "¿Qué medio físico se usa comúnmente en redes Ethernet actuales?", "respuesta": "Par trenzado", "nota": "El cable UTP con conector RJ-45."},
      {"pregunta": "¿Cuál de las siguientes afirmaciones sobre routers es correcta?", "respuesta": "Permiten la interconexión entre redes diferentes", "nota": ""},
      {"pregunta": "¿Cuál es una característica de la topología en estrella?", "respuesta": "Uso de cableado independiente", "nota": "Cada equipo con su propio cable al switch."},
      {"pregunta": "En una simulación de red, ¿cuál es el primer paso lógico antes de conectar físicamente los dispositivos?", "respuesta": "Diseñar el direccionamiento IP", "nota": ""},
      {"pregunta": "¿Qué utilidad tiene el comando tracert en diagnóstico de red?", "respuesta": "Rastrear la ruta hacia un destino", "nota": "Muestra cada salto o router del camino."},
      {"pregunta": "Durante la simulación, un host no responde a un ping. ¿Cuál de los siguientes pasos es más adecuado?", "respuesta": "Revisar las direcciones IP y máscaras de subred", "nota": ""},
      {"pregunta": "¿Cuál de los siguientes elementos físicos permite la conexión entre una computadora y la red?", "respuesta": "NIC (tarjeta de red)", "nota": ""},
      {"pregunta": "¿Qué tipo de red cubre una distancia geográfica limitada como una oficina o edificio?", "respuesta": "LAN", "nota": "PAN es personal, MAN una ciudad, WAN países."},
      {"pregunta": "¿Cuál es el nombre del estándar IEEE para Ethernet?", "respuesta": "802.3", "nota": "802.11 es Wi-Fi, 802.15 es Bluetooth."},
      {"pregunta": "¿Qué velocidad ofrece Gigabit Ethernet?", "respuesta": "1 Gbps", "nota": "Ojo con MBps mayúscula, esa es otra medida."}
    ];

    // Palabras que no ayudan a distinguir una pregunta de otra.
    const VACIAS = new Set([
      "que", "cual", "cuales", "de", "del", "la", "el", "los", "las",
      "un", "una", "en", "es", "son", "se", "por", "para", "con", "y",
      "o", "a", "al", "lo", "su", "sus", "este", "esta", "siguientes",
      "siguiente", "como", "mas", "pero", "tipo", "tipos"
    ]);

    // Siglas de 1 o 2 letras que sí queremos conservar.
    const CORTAS = new Set(["ip", "fq"]);

    // Por debajo de este puntaje no cambiamos la tarjeta.
    // Una palabra suelta muy común (capa, red, protocolo) queda debajo.
    // Con dos palabras útiles de la pregunta ya suele pasar.
    const UMBRAL = 2;

    // Cuántas palabras recientes miramos. Lo de más atrás se ignora.
    const VENTANA = 25;

    // Si pasan 20 segundos sin una coincidencia clara, olvidamos lo dictado.
    const SILENCIO_MS = 20000;

    // Pausa sin palabras nuevas: ahí se busca la pregunta. Cada resultado lo rearma.
    const PAUSA_MS = 1300;

    // Velocidad de la lectura. hablar() la toma de aquí.
    const VELOCIDAD = 1.1;

    // iPhone y iPad. En esos equipos el reconocimiento continuo no existe.
    const ES_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                   (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    // En iPhone "es-PE" a veces no está. En Android se queda en es-PE.
    const IDIOMA = ES_IOS ? "es-MX" : "es-PE";

    const boton = document.getElementById("btn-escuchar");
    const transcripcion = document.getElementById("transcripcion");
    const mensaje = document.getElementById("mensaje");
    const tarjeta = document.getElementById("tarjeta");
    const estado = document.getElementById("estado");
    const leerVoz = document.getElementById("leer-voz");
    const avisarEscucha = document.getElementById("avisar-escucha");
    const reiniciosEl = document.getElementById("reinicios");
    const buscador = document.getElementById("buscador");
    const diagnostico = document.getElementById("diagnostico");

    let reconocimiento = null;
    let quiereEscuchar = false;
    let reinicioPendiente = false;
    let reinicios = 0;
    let pantalla = null;
    let palabrasFinales = [];
    let firmaVisible = "";
    let resultadoVisible = null;
    let ultimaCoincidencia = Date.now();

    // True mientras la página está hablando. En ese rato el micrófono va apagado.
    let hablando = false;

    // Sirve para que solo el último discurso borre la firma, 2 segundos después.
    let turnoFirma = 0;

    // La voz en español se elige una sola vez, no en cada frase.
    let vozElegida = null;

    // Lo último que se dictó. En iPhone se evalúa cuando Safari corta solo.
    let ultimoDictado = "";

    // Safari solo habla si el primer sonido sale de un toque. Una vez por sesión.
    let vozDesbloqueada = false;

    // En iPhone, si el reenganche falla dos veces, el resto de la sesión es a toques.
    let fallosReenganche = 0;
    let modoToqueForzado = false;
    let vigilaHasta = 0;
    let reengancheMarca = 0;

    // El cierre del micrófono lo provocó la propia voz, no el usuario.
    let cierrePorVoz = false;

    // Se cancelan al empezar cada escucha, para que no disparen el turno viejo.
    let temporizadorSilencio = null;
    let temporizadorFirma = null;
    let temporizadorFlags = null;

    // En iPhone el uso es un toque por pregunta. Android no entra aquí.
    if (ES_IOS) {
      boton.textContent = "Toca y pregunta";
      boton.classList.add("modo-ios");
      document.getElementById("aviso-principal").textContent = "En iPhone: toca el botón, haz tu pregunta y espera la respuesta. Un toque por pregunta. Usa audífonos.";
      document.getElementById("aviso-audifonos").hidden = true;
      reiniciosEl.hidden = true;
    }

    // --- Texto ----------------------------------------------------------------

    // Arregla siglas que el dictado escribe mal, antes de normalizar.
    // También se aplica a las preguntas, para que los dos lados queden igual.
    // El \b evita cortar palabras normales: "tipo" no es "ip", "dispositivos" no es "osi".
    function corregirSiglas(texto) {
      let t = texto;
      const reglas = [
        [/\bochocientos[\s.]*dos[\s.]*punto[\s.]*once\b/gi, " 80211 "],
        [/\bochocientos[\s.]*dos[\s.]*punto[\s.]*tres\b/gi, " 8023 "],
        [/\b802[\s.]*11\b/gi, " 80211 "],
        [/\b802[\s.]*3\b/gi, " 8023 "],
        [/\bde[\s.]*hache[\s.]*ce[\s.]*pe\b/gi, " dhcp "],
        [/\bd[\s.]*h[\s.]*c[\s.]*p\b/gi, " dhcp "],
        [/\bde[\s.]*ene[\s.]*ese\b/gi, " dns "],
        [/\bd[\s.]*n[\s.]*s\b/gi, " dns "],
        [/\bhache[\s.]*te[\s.]*te[\s.]*pe\b/gi, " http "],
        [/\bh[\s.]*t[\s.]*t[\s.]*p\b/gi, " http "],
        [/\bte[\s.]*ce[\s.]*pe\b/gi, " tcp "],
        [/\bt[\s.]*c[\s.]*p\b/gi, " tcp "],
        [/\bu[\s.]*de[\s.]*pe\b/gi, " udp "],
        [/\bu[\s.]*d[\s.]*p\b/gi, " udp "],
        [/\ba[\s.]*erre[\s.]*pe\b/gi, " arp "],
        [/\ba[\s.]*r[\s.]*p\b/gi, " arp "],
        [/\bge[\s.]*be[\s.]*pe[\s.]*ese\b/gi, " gbps "],
        [/\bgigabit\b/gi, " gbps "],
        [/\bo[\s.]*ese[\s.]*i\b/gi, " osi "],
        [/\bo[\s.]*s[\s.]*i\b/gi, " osi "],
        [/\bni[\s.]*c\b/gi, " nic "],
        [/\bm[\s.]*a[\s.]*c\b/gi, " mac "],
        [/\bi[\s.]*p\b/gi, " ip "]
      ];

      for (let i = 0; i < reglas.length; i++) {
        t = t.replace(reglas[i][0], reglas[i][1]);
      }
      return t;
    }

    // Minúsculas, sin tildes, sin puntuación y con un solo espacio entre palabras.
    function normalizar(texto) {
      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Palabras que de verdad sirven para comparar.
    function palabrasUtiles(texto) {
      const limpio = normalizar(corregirSiglas(texto));
      if (!limpio) return [];

      const salida = [];
      const partes = limpio.split(" ");
      for (let i = 0; i < partes.length; i++) {
        const palabra = partes[i];
        if (!palabra) continue;
        if (VACIAS.has(palabra)) continue;
        if (palabra.length <= 2 && !CORTAS.has(palabra)) continue;
        salida.push(palabra);
      }
      return salida;
    }

    // Preparamos cada pregunta una sola vez, al abrir la página.
    const PREPARADAS = BANCO.map(function (item, indice) {
      const lista = palabrasUtiles(item.pregunta);
      return {
        indice: indice,
        pregunta: item.pregunta,
        respuesta: item.respuesta,
        nota: item.nota,
        unicas: new Set(lista),
        cantidad: lista.length
      };
    });

    // Cuántas preguntas contienen cada palabra. Sirve para la rareza.
    const frecuencia = {};
    for (let i = 0; i < PREPARADAS.length; i++) {
      PREPARADAS[i].unicas.forEach(function (palabra) {
        frecuencia[palabra] = (frecuencia[palabra] || 0) + 1;
      });
    }

    const totalPreguntas = PREPARADAS.length;
    const pesoPorPalabra = {};
    Object.keys(frecuencia).forEach(function (palabra) {
      // Mientras más rara, más pesa.
      // Una palabra de una sola pregunta vale cerca del doble que "capa" o "red".
      pesoPorPalabra[palabra] = 1 + Math.log(totalPreguntas / frecuencia[palabra]);
    });

    // Compara lo dictado (o lo escrito) con todas las preguntas.
    // Devuelve null si no hay una coincidencia clara.
    function emparejar(texto) {
      const dictado = new Set(palabrasUtiles(texto));
      if (dictado.size === 0) return null;

      const ranking = PREPARADAS.map(function (pregunta) {
        let suma = 0;
        pregunta.unicas.forEach(function (palabra) {
          if (dictado.has(palabra)) suma += pesoPorPalabra[palabra];
        });
        const divisor = Math.sqrt(pregunta.cantidad || 1);
        return { pregunta: pregunta, puntaje: suma / divisor };
      });

      ranking.sort(function (a, b) { return b.puntaje - a.puntaje; });

      const mejor = ranking[0];
      const segundo = ranking[1];
      if (!mejor || mejor.puntaje < UMBRAL) return null;

      // Si van muy parejas, no arriesgamos una sola.
      if (segundo && segundo.puntaje > 0) {
        const diferencia = (mejor.puntaje - segundo.puntaje) / mejor.puntaje;
        if (diferencia < 0.15) {
          return { tipo: "dos", opciones: [mejor.pregunta, segundo.pregunta] };
        }
      }

      return { tipo: "una", opciones: [mejor.pregunta] };
    }

    function firmaDe(resultado) {
      const ids = resultado.opciones.map(function (o) { return o.indice; });
      ids.sort(function (a, b) { return a - b; });
      return resultado.tipo + ":" + ids.join("-");
    }

    // --- Pantalla -------------------------------------------------------------

    function pintarTarjeta(resultado) {
      tarjeta.textContent = "";

      if (resultado.tipo === "dos") {
        const titulo = document.createElement("p");
        titulo.className = "titulo-duda";
        titulo.textContent = "Puede ser una de estas dos";
        tarjeta.appendChild(titulo);
      }

      for (let i = 0; i < resultado.opciones.length; i++) {
        tarjeta.appendChild(bloquePregunta(resultado.opciones[i]));
      }
    }

    function bloquePregunta(item) {
      const caja = document.createElement("div");
      caja.className = "opcion";

      const pregunta = document.createElement("p");
      pregunta.className = "pregunta";
      pregunta.textContent = item.pregunta;

      const respuesta = document.createElement("p");
      respuesta.className = "respuesta";
      respuesta.textContent = item.respuesta;

      caja.appendChild(pregunta);
      caja.appendChild(respuesta);

      if (item.nota) {
        const nota = document.createElement("p");
        nota.className = "nota";
        nota.textContent = item.nota;
        caja.appendChild(nota);
      }

      return caja;
    }

    // Solo redibuja si cambió la pregunta. Así la tarjeta no parpadea.
    function publicarSiCambio(resultado) {
      const firma = firmaDe(resultado);
      if (firma === firmaVisible) return;
      firmaVisible = firma;
      resultadoVisible = resultado;
      pintarTarjeta(resultado);
      actualizarDiagnostico();
      // Si el interruptor está apagado, se muestra la tarjeta y no se habla.
      if (leerVoz.checked) decirResultado(resultado);
    }

    function pintarBoton() {
      boton.classList.remove("activo");
      boton.classList.remove("hablando");
      // Ámbar mientras responde, aunque el botón siga diciendo Detener.
      if (hablando) boton.classList.add("hablando");
      if (!quiereEscuchar) {
        if (ES_IOS && modoToqueForzado) boton.textContent = "Toca para la siguiente pregunta";
        else boton.textContent = ES_IOS ? "Toca y pregunta" : "Escuchar";
      } else if (ES_IOS) {
        boton.textContent = "Escuchando… habla ahora";
        boton.classList.add("activo");
      } else {
        boton.textContent = "Detener";
        if (!hablando) boton.classList.add("activo");
      }
      actualizarDiagnostico();
    }

    function mostrarReinicios() {
      reiniciosEl.textContent = "Reinicios: " + reinicios;
    }

    // --- Voz en alto ----------------------------------------------------------

    // Guarda una voz en español la primera vez que el navegador ya tiene la lista.
    function guardarVoz() {
      if (vozElegida || !window.speechSynthesis) return;
      const voces = window.speechSynthesis.getVoices();
      if (!voces.length) return;

      let respaldo = null;
      for (let i = 0; i < voces.length; i++) {
        const idioma = (voces[i].lang || "").toLowerCase();
        const preferida = ES_IOS ? "es-mx" : "es-pe";
        if (idioma === preferida) {
          vozElegida = voces[i];
          return;
        }
        if (!respaldo && idioma.indexOf("es") === 0) respaldo = voces[i];
      }
      if (respaldo) vozElegida = respaldo;
    }

    if (window.speechSynthesis) {
      guardarVoz();
      window.speechSynthesis.addEventListener("voiceschanged", guardarVoz);
    }

    // Arma lo que se va a decir. El punto después de la pregunta es la pausa corta.
    function textoDeResultado(resultado) {
      if (resultado.tipo === "dos") {
        const primera = resultado.opciones[0];
        const segunda = resultado.opciones[1];
        return "Puede ser una de estas dos. Primera: " + primera.pregunta
          + ", la respuesta es " + primera.respuesta
          + ". Segunda: " + segunda.pregunta
          + ", la respuesta es " + segunda.respuesta + ".";
      }

      const item = resultado.opciones[0];
      let texto = "Entendí: " + item.pregunta + ". La respuesta es: " + item.respuesta;
      if (item.nota) texto += ". " + item.nota;
      return texto;
    }

    function decirResultado(resultado) {
      if (!resultado) return;
      hablar(textoDeResultado(resultado));
    }

    // Apaga el micrófono, dice el texto y al terminar vuelve a escuchar.
    // Devuelve una promesa que se cumple cuando ya acabó de hablar.
    function hablar(texto) {
      return new Promise(function (resolve) {
        if (!texto) {
          resolve();
          return;
        }

        hablando = true;
        estado.textContent = "Respondiendo…";
        pintarBoton();

        // Si onend no llega, estas banderas no pueden quedarse en true.
        clearTimeout(temporizadorFlags);
        temporizadorFlags = setTimeout(function () {
          hablando = false;
          cierrePorVoz = false;
          pintarBoton();
        }, 3000);

        // El micrófono se apaga antes de que suene la voz.
        cierrePorVoz = false;
        clearTimeout(temporizadorSilencio);
        temporizadorSilencio = null;
        if (reconocimiento) {
          try {
            reconocimiento.stop();
            cierrePorVoz = true;
          } catch (error) {}
        }

        let termino = false;
        let seguro = null;

        function finalizar(forzado) {
          if (termino) return;
          termino = true;
          clearTimeout(seguro);
          clearTimeout(temporizadorFlags);
          temporizadorFlags = null;

          // Si el tiempo de seguridad ganó, cortamos lo que siga sonando.
          if (forzado && window.speechSynthesis) {
            try { window.speechSynthesis.cancel(); } catch (error) {}
          }

          hablando = false;
          palabrasFinales = [];
          ultimoDictado = "";
          transcripcion.textContent = "";
          pintarBoton();

          // 700 ms después de terminar la respuesta, vuelve a escuchar sola.
          if (quiereEscuchar && !(ES_IOS && modoToqueForzado)) {
            setTimeout(function () {
              if (hablando || !quiereEscuchar) return;
              if (ES_IOS && modoToqueForzado) return;
              prepararReenganche();
            }, 700);
          } else {
            estado.textContent = "";
          }

          // Dos segundos después se puede volver a pedir la misma pregunta.
          // Así el final de la frase no la dispara otra vez al toque.
          clearTimeout(temporizadorFirma);
          const turno = ++turnoFirma;
          temporizadorFirma = setTimeout(function () {
            if (turno !== turnoFirma) return;
            firmaVisible = "";
            actualizarDiagnostico();
          }, 2000);

          resolve();
        }

        // En algunos Android onend no llega. Este reloj fuerza el cierre.
        seguro = setTimeout(function () {
          finalizar(true);
        }, 1500 + texto.length * 90);

        if (!window.speechSynthesis) {
          finalizar(true);
          return;
        }

        try { window.speechSynthesis.cancel(); } catch (error) {}

        const frase = new SpeechSynthesisUtterance(texto);
        frase.lang = IDIOMA;
        frase.rate = VELOCIDAD;
        if (vozElegida) frase.voice = vozElegida;
        frase.onend = function () { finalizar(false); };
        frase.onerror = function () { finalizar(false); };
        try {
          window.speechSynthesis.speak(frase);
        } catch (error) {
          finalizar(true);
        }
      });
    }

    leerVoz.addEventListener("change", function () {
      if (!leerVoz.checked) {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        return;
      }
      if (resultadoVisible) decirResultado(resultadoVisible);
    });

    // --- Micrófono ------------------------------------------------------------

    function actualizarDiagnostico() {
      diagnostico.textContent =
        "escuchando: " + (quiereEscuchar ? "sí" : "no")
        + " | hablando: " + (hablando ? "sí" : "no")
        + " | palabras: " + palabrasFinales.length
        + " | firma: " + (firmaVisible || "—");
    }

    // Cada escucha nueva nace en cero. Si no, la firma vieja impide publicar.
    function reiniciarTurno() {
      palabrasFinales = [];
      ultimoDictado = "";
      transcripcion.textContent = "";
      firmaVisible = "";
      hablando = false;
      cierrePorVoz = false;
      clearTimeout(temporizadorSilencio);
      temporizadorSilencio = null;
      clearTimeout(temporizadorFirma);
      temporizadorFirma = null;
      clearTimeout(temporizadorFlags);
      temporizadorFlags = null;
      turnoFirma += 1;
      actualizarDiagnostico();
    }

    // Se rearma con cada resultado. Si se queda apagado, la pregunta no se evalúa.
    function armarTemporizadorSilencio() {
      clearTimeout(temporizadorSilencio);
      temporizadorSilencio = setTimeout(function () {
        temporizadorSilencio = null;
        if (hablando || !quiereEscuchar) return;
        const dicho = ultimoDictado;
        if (!dicho.trim()) return;
        evaluarVoz(dicho);
      }, PAUSA_MS);
    }

    function asegurarReconocimiento() {
      if (reconocimiento) return true;
      const Clase = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Clase) return false;

      reconocimiento = new Clase();
      reconocimiento.lang = IDIOMA;
      // En iPhone el modo continuo no funciona: un toque, una pregunta.
      reconocimiento.continuous = !ES_IOS;
      reconocimiento.interimResults = true;
      reconocimiento.onresult = alOir;
      reconocimiento.onerror = alError;
      reconocimiento.onend = alTerminar;
      return true;
    }

    function alOir(evento) {
      // Mientras habla, no guardamos nada de lo que el micrófono todavía alcance a oír.
      if (hablando) return;

      let provisional = "";
      for (let i = evento.resultIndex; i < evento.results.length; i++) {
        const frase = evento.results[i][0].transcript;
        if (evento.results[i].isFinal) {
          const trozos = frase.trim().split(/\s+/);
          for (let k = 0; k < trozos.length; k++) {
            if (trozos[k]) palabrasFinales.push(trozos[k]);
          }
        } else {
          provisional += frase + " ";
        }
      }

      if (palabrasFinales.length > VENTANA) {
        palabrasFinales = palabrasFinales.slice(-VENTANA);
      }

      const extra = provisional.trim() ? provisional.trim().split(/\s+/) : [];
      const ventana = palabrasFinales.concat(extra).slice(-VENTANA);
      ultimoDictado = ventana.join(" ");
      transcripcion.textContent = ultimoDictado;
      // En iPhone se espera a que Safari corte solo. No se responde a medias.
      // En el resto, 1300 ms de silencio. Cada resultado rearma ese reloj.
      if (!ES_IOS) armarTemporizadorSilencio();
      actualizarDiagnostico();
    }

    // ¿La frase trae esa palabra o esas palabras, sueltas?
    function tieneFrase(limpio, frase) {
      return (" " + limpio + " ").indexOf(" " + frase + " ") !== -1;
    }

    function evaluarVoz(texto) {
      // Comandos sobre el texto ya normalizado, antes de buscar en el banco.
      const limpio = normalizar(texto);

      if (tieneFrase(limpio, "repite") || tieneFrase(limpio, "repitelo") || tieneFrase(limpio, "otra vez")) {
        if (resultadoVisible) decirResultado(resultadoVisible);
        return;
      }

      // "para" solo corta si la frase es corta. En una pregunta larga se ignora.
      const fraseCorta = limpio.split(" ").length <= 2;
      if ((fraseCorta && tieneFrase(limpio, "para")) || tieneFrase(limpio, "detente") || tieneFrase(limpio, "silencio")) {
        // Se borra lo dictado para que, al volver a escuchar, el comando no corte de nuevo.
        palabrasFinales = [];
        transcripcion.textContent = "";
        detener();
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (error) {}
        }
        return;
      }

      const resultado = emparejar(texto);
      if (!resultado) {
        // Sin coincidencia clara: la tarjeta se queda y no se habla.
        if (quiereEscuchar) estado.textContent = "escuchando...";
        return;
      }
      ultimaCoincidencia = Date.now();
      estado.textContent = "";
      publicarSiCambio(resultado);
    }

    function alError(evento) {
      const codigo = evento.error || "";

      if (codigo === "not-allowed" || codigo === "service-not-allowed") {
        // Un not-allowed justo después del reenganche cuenta como fallo, no como aviso de Ajustes.
        if (ES_IOS && codigo === "not-allowed" && Date.now() < vigilaHasta) {
          anotarFalloReenganche();
          return;
        }
        quiereEscuchar = false;
        reinicioPendiente = false;
        soltarPantalla();
        pintarBoton();
        estado.textContent = "";
        if (ES_IOS && codigo === "not-allowed") {
          mensaje.textContent = "Safari no está dando el micrófono. Revisa Ajustes, Safari, Micrófono, y ponlo en Preguntar o Permitir. También revisa que Siri y Dictado estén activados.";
        } else {
          mensaje.textContent = "Hay que dar permiso al micrófono. Cuando Chrome lo pida, elige Permitir. Si ya lo bloqueaste, actívalo en los permisos del sitio y toca Escuchar otra vez.";
        }
        return;
      }

      // "no-speech" es normal cuando te callas un momento. No mostramos error.
      if (codigo === "no-speech") programarReinicio();
    }

    // Safari cortó solo. Si hay respuesta, al terminar de decirla se reengancha sola.
    function cerrarToqueIos() {
      const dicho = ultimoDictado;
      ultimoDictado = "";
      palabrasFinales = [];
      if (!dicho.trim()) {
        quedarseEnToque();
        return;
      }
      evaluarVoz(dicho);
      // Si no llegó a hablar, no hay onend que reabra el micrófono.
      if (!hablando) quedarseEnToque();
    }

    function quedarseEnToque() {
      quiereEscuchar = false;
      reinicioPendiente = false;
      soltarPantalla();
      pintarBoton();
      estado.textContent = "";
    }

    // Después de la respuesta: avisa y abre el micrófono. En Android, siempre.
    function prepararReenganche() {
      if (!quiereEscuchar || hablando) return;
      if (ES_IOS && modoToqueForzado) return;
      if (avisarEscucha.checked) decirDime(iniciarReenganche);
      else iniciarReenganche();
    }

    // "Dime" suena antes de abrir el micrófono, para que no lo transcriba.
    function decirDime(luego) {
      let listo = false;
      function seguir() {
        if (listo) return;
        listo = true;
        luego();
      }
      if (!window.speechSynthesis) {
        seguir();
        return;
      }
      const aviso = new SpeechSynthesisUtterance("Dime");
      aviso.lang = IDIOMA;
      aviso.rate = VELOCIDAD;
      if (vozElegida) aviso.voice = vozElegida;
      aviso.onend = seguir;
      aviso.onerror = seguir;
      try {
        window.speechSynthesis.speak(aviso);
      } catch (error) {
        seguir();
        return;
      }
      setTimeout(seguir, 1200);
    }

    function iniciarReenganche() {
      if (!quiereEscuchar || hablando) return;
      if (ES_IOS && modoToqueForzado) return;
      if (!reconocimiento && !asegurarReconocimiento()) {
        if (ES_IOS) anotarFalloReenganche();
        return;
      }

      try {
        reiniciarTurno();
        reconocimiento.start();
      } catch (error) {
        if (ES_IOS) anotarFalloReenganche();
        else reintentarReengancheAndroid();
        return;
      }

      if (ES_IOS) vigilarReenganche();
      pintarBoton();
      estado.textContent = ES_IOS ? "" : "escuchando...";
      pedirPantallaEncendida();
    }

    // Android no lleva contador: un reintento y sigue.
    function reintentarReengancheAndroid() {
      setTimeout(function () {
        if (!quiereEscuchar || hablando || !reconocimiento) return;
        try {
          reiniciarTurno();
          reconocimiento.start();
          pintarBoton();
          estado.textContent = "escuchando...";
        } catch (error) {}
      }, 300);
    }

    // Si en el segundo siguiente Safari dice not-allowed, este intento no valió.
    function vigilarReenganche() {
      const marca = Date.now();
      reengancheMarca = marca;
      vigilaHasta = marca + 1000;
      setTimeout(function () {
        if (reengancheMarca !== marca || modoToqueForzado) return;
        fallosReenganche = 0;
      }, 1000);
    }

    function anotarFalloReenganche() {
      fallosReenganche += 1;
      reengancheMarca = 0;
      vigilaHasta = 0;
      quiereEscuchar = false;
      reinicioPendiente = false;
      if (fallosReenganche >= 2) modoToqueForzado = true;
      soltarPantalla();
      pintarBoton();
      estado.textContent = "";
    }

    function alTerminar() {
      // Este cierre lo pidió hablar(), para no oírse. No es un corte de Safari ni de Chrome.
      if (cierrePorVoz) {
        cierrePorVoz = false;
        return;
      }
      // Si se apagó porque estamos hablando, el reinicio lo hace hablar() al terminar.
      if (hablando) return;
      if (ES_IOS) {
        if (quiereEscuchar) cerrarToqueIos();
        return;
      }
      if (!quiereEscuchar) return;
      programarReinicio();
    }

    // Chrome en el celular corta la escucha solo. Si no tocaste Detener, la reanudamos.
    // En iPhone no se usa: cada pregunta empieza con un toque.
    function programarReinicio() {
      if (ES_IOS) return;
      if (hablando) return;
      if (!quiereEscuchar || reinicioPendiente) return;
      reinicioPendiente = true;
      setTimeout(function () {
        reinicioPendiente = false;
        if (hablando) return;
        if (!quiereEscuchar || !reconocimiento) return;
        try {
          reconocimiento.start();
          reinicios += 1;
          mostrarReinicios();
        } catch (error) {
          // A veces start() llega cuando todavía no terminó la vez anterior.
        }
      }, 300);
    }

    function empezar() {
      mensaje.textContent = "";
      if (!asegurarReconocimiento()) {
        mensaje.textContent = "Este navegador no puede escuchar. Abre el archivo con Chrome.";
        return;
      }

      quiereEscuchar = true;
      ultimaCoincidencia = Date.now();
      reiniciarTurno();
      pintarBoton();
      estado.textContent = ES_IOS ? "" : "escuchando...";
      pedirPantallaEncendida();

      try {
        reiniciarTurno();
        reconocimiento.start();
      } catch (error) {
        setTimeout(function () {
          if (!quiereEscuchar) return;
          try {
            reiniciarTurno();
            reconocimiento.start();
          } catch (error2) {
            quiereEscuchar = false;
            pintarBoton();
            mensaje.textContent = "No pude iniciar el micrófono. Toca Escuchar otra vez.";
          }
        }, 300);
      }
    }

    function detener() {
      quiereEscuchar = false;
      reinicioPendiente = false;
      clearTimeout(temporizadorSilencio);
      temporizadorSilencio = null;
      pintarBoton();
      estado.textContent = "";
      soltarPantalla();
      if (reconocimiento) {
        try { reconocimiento.stop(); } catch (error) {}
      }
    }

    // El primer toque en iPhone suelta un sonido mudo. Si no, Safari no deja hablar después.
    function desbloquearVoz() {
      if (!ES_IOS || vozDesbloqueada || !window.speechSynthesis) return;
      vozDesbloqueada = true;
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      window.speechSynthesis.speak(u);
    }

    boton.addEventListener("click", function () {
      desbloquearVoz();
      // Mientras responde, un toque nuevo no abre el micrófono.
      if (ES_IOS && hablando) return;
      if (quiereEscuchar) detener();
      else empezar();
    });

    // En modo toque, un toque en la pantalla escucha. El buscador y los interruptores no.
    document.addEventListener("click", function (evento) {
      if (!ES_IOS || quiereEscuchar || hablando) return;
      const origen = evento.target;
      if (origen.closest && origen.closest("#buscador, label.buscar, label.interruptor, #btn-escuchar")) return;
      desbloquearVoz();
      empezar();
    });

    // Cada segundo: si llevamos 20 s sin acertar, borramos lo dictado.
    // La tarjeta de la última respuesta se queda.
    setInterval(function () {
      if (ES_IOS) return;
      if (!quiereEscuchar) return;
      if (palabrasFinales.length === 0) return;
      if (Date.now() - ultimaCoincidencia < SILENCIO_MS) return;
      palabrasFinales = [];
      transcripcion.textContent = "";
      ultimaCoincidencia = Date.now();
      estado.textContent = "escuchando...";
      actualizarDiagnostico();
    }, 1000);

    setInterval(actualizarDiagnostico, 400);
    actualizarDiagnostico();

    // --- Pantalla encendida ---------------------------------------------------

    function pedirPantallaEncendida() {
      try {
        if (!navigator.wakeLock || !quiereEscuchar) return;
        navigator.wakeLock.request("screen").then(function (candado) {
          pantalla = candado;
        }).catch(function () {
          // No siempre está disponible, sobre todo al abrir el archivo directo.
        });
      } catch (error) {}
    }

    function soltarPantalla() {
      try {
        if (!pantalla) return;
        const candado = pantalla;
        pantalla = null;
        candado.release().catch(function () {});
      } catch (error) {}
    }

    // Si vuelves a esta pantalla, pedimos de nuevo que no se apague.
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && quiereEscuchar) {
        pedirPantallaEncendida();
      }
    });

    // --- Buscador -------------------------------------------------------------

    buscador.addEventListener("input", function () {
      const texto = buscador.value.trim();
      if (!texto) return;

      const resultado = emparejar(texto);
      if (!resultado) {
        if (palabrasUtiles(texto).length > 0) {
          estado.textContent = "No hay una coincidencia clara.";
        }
        return;
      }

      estado.textContent = "";
      publicarSiCambio(resultado);
    });
  </script>
</body>
</html>
